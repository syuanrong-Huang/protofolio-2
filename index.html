<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>街角作品集｜15張傳單互動牆</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "Segoe UI", Roboto, sans-serif;
      background: #1c1a17;
      position: relative;
    }

    /* ================= 1. 滿版清晰街景背景 ================= */
    .street-scene {
      position: absolute;
      inset: 0;
      z-index: 0;
      background-image: url('./bg.jpg?v=11');
      background-size: cover;
      background-position: 72% center;
      background-repeat: no-repeat;
      transition: filter 0.45s cubic-bezier(0.22, 1, 0.36, 1), transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: filter, transform;
    }

    /* Zoom-in 閱讀時背景模糊暗化 */
    body.zoomed .street-scene {
      filter: blur(12px) brightness(0.62);
      transform: scale(1.04);
    }

    /* ================= 2. 頂部引導與進度提示 ================= */
    .header-guide {
      position: absolute;
      top: 20px;
      left: 28px;
      z-index: 20;
      background: rgba(24, 22, 20, 0.8);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      padding: 9px 18px;
      border-radius: 999px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.28);
      font-size: 13px;
      color: #f8fafc;
      letter-spacing: 0.3px;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: opacity 0.3s ease;
    }

    .progress-pill {
      background: #ef4444;
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 999px;
    }

    body.zoomed .header-guide {
      opacity: 0;
      pointer-events: none;
    }

    /* ================= 3. 電線桿上的 15 張傳單容器（加寬拉長，讓傳單貼得更寬敞） ================= */
    .pole-flyers-zone {
      position: absolute;
      left: 72%;
      top: 50%;
      width: 280px;
      height: 95vh;
      transform: translate(-50%, -50%);
      perspective: 950px;
      z-index: 10;
      transition: opacity 0.3s ease;
    }

    body.zoomed .pole-flyers-zone {
      opacity: 0;
      pointer-events: none;
    }

    /* 單張傳單（尺寸加大至 76x106px） */
    .mini-flyer {
      position: absolute;
      width: 76px;
      height: 106px;
      background: #fdfbf7;
      border-radius: 2px;
      cursor: pointer;
      box-shadow: -2px 4px 10px rgba(15, 14, 12, 0.45);
      transition:
        transform 0.25s cubic-bezier(0.16, 1, 0.3, 1),
        box-shadow 0.25s ease,
        filter 0.25s ease;
      overflow: visible;
    }

    .mini-flyer:hover {
      transform: translate(-50%, -50%) scale(1.28) rotate(0deg) !important;
      z-index: 99 !important;
      filter: brightness(1.04) !important;
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.65);
    }

    /* 引導光暈動畫：標示目前建議點擊的「下一張（從 #01 開始）」 */
    @keyframes pulseBeacon {
      0% {
        box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.85), -2px 4px 12px rgba(0, 0, 0, 0.5);
      }
      70% {
        box-shadow: 0 0 0 12px rgba(239, 68, 68, 0), -2px 4px 12px rgba(0, 0, 0, 0.5);
      }
      100% {
        box-shadow: 0 0 0 0 rgba(239, 68, 68, 0), -2px 4px 12px rgba(0, 0, 0, 0.5);
      }
    }

    .mini-flyer.is-next {
      animation: pulseBeacon 1.8s infinite;
      outline: 2px solid #ef4444;
      z-index: 50 !important;
    }

    .guide-badge {
      position: absolute;
      top: -19px;
      left: 50%;
      transform: translateX(-50%);
      background: #ef4444;
      color: #ffffff;
      font-size: 9.5px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 4px;
      white-space: nowrap;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
      pointer-events: none;
      letter-spacing: 0.4px;
    }

    .guide-badge::after {
      content: "";
      position: absolute;
      bottom: -3px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 3px 3px 0;
      border-style: solid;
      border-color: #ef4444 transparent transparent;
    }

    .mini-flyer.is-read .mini-flyer-inner::after {
      content: "✓";
      position: absolute;
      bottom: 4px;
      left: 5px;
      font-size: 10px;
      font-weight: 900;
      color: rgba(15, 23, 42, 0.55);
    }

    .mini-flyer-inner {
      width: 100%;
      height: 100%;
      overflow: hidden;
      border-radius: 2px;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 8px 7px;
    }

    .mini-flyer-inner img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .mini-tape {
      position: absolute;
      top: -4px;
      left: 50%;
      transform: translateX(-50%);
      width: 26px;
      height: 7px;
      z-index: 5;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
    }

    .mini-tag {
      font-size: 6.5px;
      font-weight: 800;
      opacity: 0.75;
      letter-spacing: 0.2px;
    }

    .mini-title {
      font-size: 9.5px;
      font-weight: 800;
      line-height: 1.24;
      margin-top: 3px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .mini-num {
      font-size: 8px;
      font-weight: 800;
      opacity: 0.75;
      border-top: 1px dashed rgba(0, 0, 0, 0.25);
      padding-top: 3px;
      text-align: right;
    }

    @media (max-width: 768px) {
      .header-guide {
        left: 50%;
        transform: translateX(-50%);
        font-size: 11.5px;
        padding: 7px 14px;
        white-space: nowrap;
      }
      .pole-flyers-zone {
        left: 68%;
        width: 220px;
      }
      .mini-flyer {
        width: 62px;
        height: 86px;
      }
    }

    /* ================= 4. Zoom-in 放大閱讀視窗（純粹單張閱讀，無上下頁按鈕） ================= */
    .reader-overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }

    body.zoomed .reader-overlay {
      opacity: 1;
      pointer-events: auto;
    }

    .reader-card {
      position: relative;
      width: 100%;
      max-width: 520px;
      max-height: 84vh;
      background: #ffffff;
      border-radius: 10px;
      box-shadow: 0 28px 70px rgba(0, 0, 0, 0.58);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transform: scale(0.84) translateY(16px);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    body.zoomed .reader-card {
      transform: scale(1) translateY(0);
    }

    .btn-close {
      position: fixed;
      top: 24px;
      right: 28px;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: rgba(24, 22, 20, 0.8);
      backdrop-filter: blur(8px);
      color: #ffffff;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, transform 0.15s;
      z-index: 60;
    }

    .btn-close:hover {
      background: rgba(24, 22, 20, 0.96);
      transform: scale(1.06);
    }

    .reader-viewport {
      width: 100%;
      overflow-y: auto;
      max-height: 76vh;
    }

    .reader-viewport img {
      width: 100%;
      height: auto;
      display: block;
    }

    .reader-footer {
      padding: 14px 20px;
      background: #fafaf9;
      border-top: 1px solid #e7e5e4;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .page-title {
      font-size: 14px;
      font-weight: 700;
      color: #1c1917;
    }

    .ext-link {
      text-decoration: none;
      background: #1c1917;
      color: #ffffff;
      padding: 7px 14px;
      border-radius: 6px;
      font-size: 12.5px;
      font-weight: 600;
      white-space: nowrap;
    }

    .ext-link:hover {
      background: #44403c;
    }

    /* 底部輕量返回提示 */
    .back-hint {
      margin-top: 14px;
      font-size: 12.5px;
      color: rgba(255, 255, 255, 0.78);
      letter-spacing: 0.4px;
      cursor: pointer;
    }

    .back-hint:hover {
      color: #ffffff;
    }
  </style>
</head>
<body>

  <!-- 1. 滿版清晰街景背景 -->
  <div class="street-scene" id="streetScene"></div>

  <!-- 2. 頂部順序閱讀引導列 -->
  <div class="header-guide" id="headerGuide">
    <span class="progress-pill" id="progressPill">START #01</span>
    <span id="guideText">請從第 1 張傳單開始依序點擊閱讀（已閱 0 / 15）</span>
  </div>

  <!-- 3. 電線桿上的 15 張傳單區 -->
  <div class="pole-flyers-zone" id="poleFlyersZone"></div>

  <!-- 4. Zoom-in 放大閱讀視窗（已移除上一張/下一張按鈕） -->
  <div class="reader-overlay" id="readerOverlay">
    <button class="btn-close" id="closeBtn" title="返回電線桿 (ESC)">✕</button>

    <div class="reader-card">
      <div class="reader-viewport" id="readerViewport"></div>
      <div class="reader-footer">
        <span class="page-title" id="pageTitle">01. 作品名稱</span>
        <a class="ext-link" id="extLink" href="#" target="_blank">開啟完整連結 ↗</a>
      </div>
    </div>

    <div class="back-hint" id="backHint">點擊空白處或按 ESC 返回電線桿挑選下一張</div>
  </div>

  <script>
    const FLYERS_15 = [
      { title: "01. 個人簡介與履歷總覽", tag: "RESUME", heading: "個人簡介與求職履歷", desc: "創意設計與行銷企劃背景，擅長品牌視覺規劃與跨媒介整合行銷。", bgColor: "#fef3c7", textColor: "#78350f", imageUrl: "", externalLink: "https://www.linkedin.com" },
      { title: "02. 品牌識別重塑專案", tag: "BRANDING", heading: "新創咖啡品牌 CIS 識別設計", desc: "從 Logo 造型、字體規範到外帶杯包裝系統，建立溫暖且具記憶點的品牌形象。", bgColor: "#e0f2fe", textColor: "#0c4a6e", imageUrl: "", externalLink: "https://www.behance.net" },
      { title: "03. 年度社群話題操作", tag: "SOCIAL", heading: "IG 互動濾鏡與迷因企劃", desc: "結合時事話題與高共鳴圖文，單月自然觸及突破 45 萬人次。", bgColor: "#fce7f3", textColor: "#831843", imageUrl: "", externalLink: "https://www.behance.net" },
      { title: "04. 音樂祭主視覺海報", tag: "POSTER", heading: "城市獨立音樂節主視覺", desc: "運用高對比拼貼與實驗排版，呈現街頭文化與現場音樂的爆發力。", bgColor: "#dcfce7", textColor: "#14532d", imageUrl: "", externalLink: "https://www.behance.net" },
      { title: "05. 快閃店空間與動線企劃", tag: "EVENT", heading: "信義區週末快閃體驗店", desc: "負責現場打卡裝置視覺、現場體驗動線設計與 KOL 邀請合作。", bgColor: "#ffedd5", textColor: "#7c2d12", imageUrl: "", externalLink: "https://www.behance.net" },
      { title: "06. 食品包裝插畫系列", tag: "PACKAGING", heading: "手工果醬與茶飲禮盒包裝", desc: "以手繪植物插畫搭配燙金工藝，提升節慶禮盒客單價與送禮質感。", bgColor: "#f3e8ff", textColor: "#581c87", imageUrl: "", externalLink: "https://www.behance.net" },
      { title: "07. 短影音腳本與視覺指導", tag: "VIDEO", heading: "Reels / TikTok 品牌系列短片", desc: "規劃前 3 秒吸睛鉤子與分鏡視覺，平均完播率提升 38%。", bgColor: "#fef9c3", textColor: "#713f12", imageUrl: "", externalLink: "https://www.behance.net" },
      { title: "08. 展覽主視覺與導覽手冊", tag: "EXHIBITION", heading: "當代插畫聯展視覺統籌", desc: "包含主視覺海報、展場指標系統、票券與限量周邊商品設計。", bgColor: "#cffafe", textColor: "#164e63", imageUrl: "", externalLink: "https://www.behance.net" },
      { title: "09. 電商大檔視覺設計", tag: "E-COMMERCE", heading: "雙 11 購物節全站視覺規範", desc: "設計高轉換率商品首圖模板、活動頁 Banner 與社群倒數素材。", bgColor: "#ffe4e6", textColor: "#881337", imageUrl: "", externalLink: "https://www.behance.net" },
      { title: "10. 聯名周邊商品開發", tag: "MERCH", heading: "街頭潮牌聯名帆布袋與貼紙組", desc: "從插畫創作、材質打樣到社群限量抽獎預熱，開賣 2 小時全數完售。", bgColor: "#d1fae5", textColor: "#064e3b", imageUrl: "", externalLink: "https://www.behance.net" },
      { title: "11. 永續公益行銷專案", tag: "CSR / ESG", heading: "舊衣回收再造計畫宣傳企劃", desc: "以溫潤再生紙質感為視覺核心，號召超過 3,000 名消費者參與門市回收。", bgColor: "#e0e7ff", textColor: "#312e81", imageUrl: "", externalLink: "https://www.behance.net" },
      { title: "12. 書籍裝幀與排版設計", tag: "EDITORIAL", heading: "獨立生活風格誌刊物編排", desc: "負責專題攝影藝術指導、網格系統建立與內頁字體排印設計。", bgColor: "#fae8ff", textColor: "#701a75", imageUrl: "", externalLink: "https://www.behance.net" },
      { title: "13. 產品攝影與美術指導", tag: "ART DIR.", heading: "香氛系列自然光影情境攝影", desc: "設定拍攝腳本、道具陳列與色調規範，打造一致的品牌社群美學。", bgColor: "#f1f5f9", textColor: "#1e293b", imageUrl: "", externalLink: "https://www.behance.net" },
      { title: "14. 數位廣告素材 A/B 測試", tag: "ADS", heading: "Meta 廣告高點擊率視覺優化", desc: "透過多版本視覺與文案測試，將單次獲客成本（CPA）降低 27%。", bgColor: "#fef3c7", textColor: "#92400e", imageUrl: "", externalLink: "https://www.behance.net" },
      { title: "15. 聯絡資訊與面試邀約", tag: "CONTACT", heading: "歡迎與我聯繫聊聊！", desc: "期待有機會加入貴團隊，一起打造兼具美感與影響力的作品。", bgColor: "#dcfce7", textColor: "#166534", imageUrl: "", externalLink: "mailto:example@email.com" }
    ];

    /**
     * 更寬敞的 15 張錯落座標：
     * 利用電線桿左右全幅寬度（x: -26% 到 +26%）與上下全高（y: 6.5% 到 93.5%），
     * 讓 76x106px 的放大傳單錯開排列，彼此留出呼吸感且標題不被遮擋
     */
    const POLE_LAYOUT = [
      { x: -21, y:  6.5, rot: -4 },
      { x:  22, y:  9.5, rot:  5 },
      { x:  -2, y: 18.0, rot:  2 },
      { x: -25, y: 25.5, rot: -5 },
      { x:  24, y: 28.5, rot:  4 },
      { x:   1, y: 37.0, rot: -2 },
      { x: -23, y: 44.5, rot:  5 },
      { x:  22, y: 47.5, rot: -4 },
      { x:  -1, y: 56.0, rot:  3 },
      { x: -24, y: 63.5, rot: -5 },
      { x:  23, y: 66.0, rot:  5 },
      { x:   0, y: 74.5, rot: -2 },
      { x: -22, y: 82.0, rot:  4 },
      { x:  21, y: 84.5, rot: -4 },
      { x:  -1, y: 92.5, rot:  2 }
    ];

    const TAPE_COLORS = [
      "rgba(215, 42, 42, 0.85)",
      "rgba(234, 179, 8, 0.82)",
      "rgba(214, 195, 165, 0.88)",
      "rgba(59, 130, 246, 0.78)"
    ];

    const poleFlyersZone = document.getElementById("poleFlyersZone");
    const progressPill = document.getElementById("progressPill");
    const guideText = document.getElementById("guideText");
    const readerOverlay = document.getElementById("readerOverlay");
    const readerViewport = document.getElementById("readerViewport");
    const pageTitle = document.getElementById("pageTitle");
    const extLink = document.getElementById("extLink");
    const closeBtn = document.getElementById("closeBtn");
    const backHint = document.getElementById("backHint");

    const visitedSet = new Set();

    function getNextUnreadIndex() {
      for (let i = 0; i < FLYERS_15.length; i++) {
        if (!visitedSet.has(i)) return i;
      }
      return -1;
    }

    function renderAllPoleFlyers() {
      poleFlyersZone.innerHTML = "";
      const nextIdx = getNextUnreadIndex();

      if (visitedSet.size === 0) {
        progressPill.textContent = "START #01";
        guideText.textContent = "請從第 1 張傳單開始依序點擊閱讀（已閱 0 / 15）";
      } else if (nextIdx !== -1) {
        const nextNum = String(nextIdx + 1).padStart(2, "0");
        progressPill.textContent = `NEXT #${nextNum}`;
        guideText.textContent = `請繼續點擊第 ${nextIdx + 1} 張傳單（已閱 ${visitedSet.size} / 15）`;
      } else {
        progressPill.textContent = "DONE 15/15";
        guideText.textContent = "已瀏覽全部 15 張作品！可隨時點擊任一張重看";
      }

      FLYERS_15.forEach((item, index) => {
        const pos = POLE_LAYOUT[index] || { x: 0, y: 50, rot: 0 };
        const flyer = document.createElement("div");
        flyer.className = "mini-flyer";

        const isNext = index === nextIdx;
        const isRead = visitedSet.has(index);

        if (isNext) flyer.classList.add("is-next");
        if (isRead) flyer.classList.add("is-read");

        const leftPercent = 50 + pos.x;
        const curveRotateY = pos.x * 0.65;
        const shadeBrightness = (isRead ? 0.92 : 1) - Math.max(0, pos.x * 0.004);

        flyer.style.left = `${leftPercent}%`;
        flyer.style.top = `${pos.y}%`;
        flyer.style.zIndex = isNext ? 50 : 10 + (index % 4);
        flyer.style.transform = `translate(-50%, -50%) rotateY(${curveRotateY}deg) rotate(${pos.rot}deg)`;
        flyer.style.filter = `brightness(${shadeBrightness.toFixed(2)})`;
        flyer.title = `${item.title}（點擊放大閱讀）`;

        if (isNext) {
          const badge = document.createElement("div");
          badge.className = "guide-badge";
          badge.textContent = index === 0 ? "START #01" : `NEXT #${String(index + 1).padStart(2, "0")}`;
          flyer.appendChild(badge);
        }

        const tape = document.createElement("div");
        tape.className = "mini-tape";
        tape.style.background = TAPE_COLORS[index % TAPE_COLORS.length];
        flyer.appendChild(tape);

        const inner = document.createElement("div");
        inner.className = "mini-flyer-inner";
        inner.style.backgroundColor = item.bgColor;
        inner.style.color = item.textColor;

        if (item.imageUrl && item.imageUrl.trim() !== "") {
          inner.innerHTML = `<img src="${item.imageUrl}" alt="${item.title}" />`;
        } else {
          inner.innerHTML = `
            <div>
              <div class="mini-tag">${item.tag}</div>
              <div class="mini-title">${item.heading}</div>
            </div>
            <div class="mini-num">#${String(index + 1).padStart(2, "0")}</div>
          `;
        }

        flyer.appendChild(inner);
        flyer.addEventListener("click", () => openZoomReader(index));
        poleFlyersZone.appendChild(flyer);
      });
    }

    function openZoomReader(index) {
      visitedSet.add(index);
      const item = FLYERS_15[index];

      pageTitle.textContent = item.title;

      if (item.externalLink && item.externalLink.trim() !== "") {
        extLink.href = item.externalLink;
        extLink.style.display = "inline-block";
      } else {
        extLink.style.display = "none";
      }

      if (item.imageUrl && item.imageUrl.trim() !== "") {
        readerViewport.innerHTML = `<img src="${item.imageUrl}" alt="${item.title}" />`;
      } else {
        readerViewport.innerHTML = `
          <div style="padding: 44px 32px; background:${item.bgColor}; color:${item.textColor}; min-height: 400px; display:flex; flex-direction:column; justify-content:space-between;">
            <div>
              <span style="font-size:12px; font-weight:700; padding:4px 10px; border-radius:4px; background:rgba(0,0,0,0.08);">${item.tag}</span>
              <h2 style="font-size:28px; font-weight:800; margin-top:16px; line-height:1.35;">${item.heading}</h2>
              <p style="font-size:16px; line-height:1.8; margin-top:16px;">${item.desc}</p>
            </div>
            <p style="font-size:12.5px; opacity:0.72; margin-top:32px;">（提示：將程式碼內第 ${index + 1} 項的 imageUrl 換成圖片檔名後，這裡就會顯示高清設計原圖）</p>
          </div>
        `;
      }

      readerViewport.scrollTop = 0;
      document.body.classList.add("zoomed");
    }

    function closeZoomReader() {
      document.body.classList.remove("zoomed");
      renderAllPoleFlyers();
    }

    closeBtn.addEventListener("click", closeZoomReader);
    backHint.addEventListener("click", closeZoomReader);
    readerOverlay.addEventListener("click", (e) => {
      if (e.target === readerOverlay) closeZoomReader();
    });

    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && document.body.classList.contains("zoomed")) {
        closeZoomReader();
      }
    });

    renderAllPoleFlyers();
  </script>
</body>
</html>
